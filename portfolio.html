<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dynasties Capital</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
        <link rel="stylesheet" href="css/portfolio.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- 与首页一致的 HEADER -->
    <div id="nav-placeholder"></div>

    <!-- 页面标题 -->
    <section class="merch-section">
        <h2 class="merch-title">Merchandise Development</h2>
        <div class="merch-grid">
            <div class="merch-card">
                <img class="merch-img" src="./Portfolio_Merchandise/plush.png">
                <p class="merch-name">Plush</p>
            </div>

            <div class="merch-card">
                <img class="merch-img" src="./Portfolio_Merchandise/blindbox.png">
                <p class="merch-name">Blind Boxes</p>

            </div>

            <div class="merch-card">
                <img class="merch-img" src="./Portfolio_Merchandise/goods.png">
                <p class="merch-name">Goods</p>

            </div>

            <div class="merch-card">
                <img class="merch-img" src="./Portfolio_Merchandise/cards.png">
                <p class="merch-name">Cards</p>

            </div>

            <div class="merch-card">
                <img class="merch-img" src="./Portfolio_Merchandise/blocks.png">
                <p class="merch-name">Blocks</p>

            </div>

            <div class="merch-card">
                <img class="merch-img" src="./Portfolio_Merchandise/home.png">
                <p class="merch-name">Home</p>

            </div>

        </div>

        
    </section>

    <section class="stores-section">
        <h2 class="merch-title">Stores</h2>

        <div class="stores-top">
            <!-- 店内设计 -->
            <div class="store-card">
                <div class="slider" data-title="Store Design">
                    <div class="slides">
                        <img src="./images/design1.png">
                        <img src="./images/design2.png">

                    </div>
                    <div class="overlay"></div>
                    <div class="overlay-text">Store Design</div>
                </div>
            </div>

            <!-- 商品陈列 -->
            <div class="store-card">
                <div class="slider" data-title="Product Merchandising">
                    <div class="slides">
                        <img src="./images/display1.png">
                        <img src="./images/display2.png">
                        <img src="./images/display3.png">
                    </div>
                    <div class="overlay"></div>
                    <div class="overlay-text">Product Merchandising</div>
                </div>
            </div>
        </div>

        <!-- 门店 banner -->
        <div class="store-banner">
            <div class="banner-slider">
                <div class="banner-slides">
                    <img src="./images/store1.png">
                    <img src="./images/store2.png">
                    <img src="./images/store3.png">
                    <img src="./images/store4.png">

                </div>
                <button class="banner-arrow left">&#10094;</button>
                <button class="banner-arrow right">&#10095;</button>

            </div>
        </div>
    </section>


    <!-- 与首页一致的 FOOTER -->
    <div id="footer-placeholder"></div>

    <script src="js/loadComponents.js"></script>
</body>
</html>
