<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dynasties Capital</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- 与首页一致的 HEADER -->
    <div id="nav-placeholder"></div>

    <!-- 页面标题 -->
    <section class="contact-header">
        <h1 class="contact-title">Contact Us</h1>
        <p class="contact-subtitle">We’d love to hear from you. Leave us a message and our team will get back to you soon.</p>
    </section>

    <!-- 表单主体 -->
    <section class="contact-container">
        
        <form class="contact-form">

            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="6" placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>

    </section>

    <!-- 与首页一致的 FOOTER -->
    <div id="footer-placeholder"></div>

    <script src="js/loadComponents.js"></script>
</body>
</html>
